# Drupal on Apache behind Traefik.

ServerName localhost

<Directory ${APACHE_DOCUMENT_ROOT}>
    Options -Indexes +FollowSymLinks
    # Required for Drupal's .htaccess routing rules.
    AllowOverride All
    Require all granted
</Directory>

# TLS ends at Traefik. Client IP and host are resolved by Drupal's
# reverse_proxy settings; HTTPS=on also covers scripts outside Drupal.
SetEnvIf X-Forwarded-Proto "https" HTTPS=on
