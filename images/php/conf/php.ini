; Development overrides for Drupal. Errors go to stderr (docker logs).

[PHP]
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
display_startup_errors = On
log_errors = On

memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

upload_max_filesize = 100M
post_max_size = 100M

session.gc_maxlifetime = 3600

; No real MTA in the container: mail() is delivered to Mailpit.
sendmail_path = "/usr/local/bin/mailpit sendmail -S mailpit:1025"

date.timezone = Europe/Paris

; validate_timestamps must stay on: the code is edited live through the bind mount.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

realpath_cache_size = 4096K
realpath_cache_ttl = 600

apc.enable_cli = 1
apc.shm_size = 128M

; Recommended by Drupal for development (runtime assert() checks).
zend.assertions = 1
