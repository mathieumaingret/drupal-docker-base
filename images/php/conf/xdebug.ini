; Driven by the environment: XDEBUG_MODE (off by default, see `make xdebug-on`)
; and XDEBUG_START_WITH_REQUEST (trigger = only with the browser extension
; or XDEBUG_SESSION cookie/env, so regular page loads stay fast).

[xdebug]
xdebug.start_with_request = ${XDEBUG_START_WITH_REQUEST}
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
xdebug.max_nesting_level = 512
xdebug.var_display_max_depth = 10
xdebug.var_display_max_children = 256
xdebug.var_display_max_data = 1024
xdebug.log_level = 0
